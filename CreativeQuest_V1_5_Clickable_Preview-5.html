<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Creative Quest V1.5 Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#222}.phone{width:min(100vw,430px);height:100vh;min-height:700px;margin:auto;background:#f5f3ff;display:flex;flex-direction:column;overflow:hidden}.app{flex:1;overflow:auto;padding-bottom:72px}.header{display:flex;justify-content:space-between;align-items:center;padding:18px}.logo1{font-size:27px;font-weight:900;color:#6c3fd4}.logo2{font-size:21px;font-weight:900;color:#ffb900}.user{font-weight:700;font-size:14px}.card{background:white;border-radius:23px;margin:7px 8px;padding:17px;box-shadow:0 1px 5px #00000012}.btn{background:#ffc928;border:0;border-radius:17px;padding:13px 17px;font-weight:900;color:#35166e;font-size:15px;cursor:pointer}.link{border:0;background:none;color:#5b32bb;font-weight:700;padding:9px;cursor:pointer}.title{font-size:24px;font-weight:800}.setup{padding:24px;display:flex;flex-direction:column;justify-content:center;height:100%}.input{padding:13px;border:1px solid #aaa;border-radius:8px;font-size:16px}.avatars button{font-size:30px;background:none;border:0;padding:8px;cursor:pointer}.nav{height:70px;background:white;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ddd;position:fixed;bottom:0;width:min(100vw,430px)}.nav button{background:none;border:0;font-size:22px}.nav small{display:block;font-size:11px}.canvas{height:260px;background:white;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#6c3fd4;font-size:24px;font-weight:800;text-align:center}.back{padding:15px}.muted{color:#777}.error{color:red}.badge{display:inline-block;margin:4px;padding:7px 10px;border-radius:14px;background:#f1eaff}.wild{font-weight:900;color:#6c3fd4}
</style></head><body><div class="phone"><div id="root" class="app"></div><div id="nav"></div></div><script>
const qs=['Draw It ✏️','Story Maker 📖','Music Maker 🎵','Invent It 💡','Act It Out 🎭','Build It 🧱'];let state={name:localStorage.name||'',avatar:localStorage.avatar||'🦊',stars:+localStorage.stars||0,quests:+localStorage.quests||0,screen:localStorage.name?'home':'setup',activity:'Draw It ✏️',wild:false,pin:'',error:''};
function save(){localStorage.name=state.name;localStorage.avatar=state.avatar;localStorage.stars=state.stars;localStorage.quests=state.quests}function go(s){state.screen=s;render()}function card(x){return `<div class=card>${x}</div>`}function btn(t,f){return `<button class=btn onclick="${f}">${t}</button>`}function header(){return `<div class=header><div><div class=logo1>Creative</div><div class=logo2>QUEST</div></div><div class=user>${state.avatar} ${esc(state.name)}　⭐ ${state.stars}<br><button class=link onclick="go('parent')">🔒 Parent</button></div></div>`}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){if(['setup','parent','parentDash'].includes(state.screen))return '';return `<div class=nav><button onclick="go('home')">🏠<small>Home</small></button><button onclick="go('quests')">🚩<small>Quests</small></button><button onclick="go('gallery')">🖼️<small>Gallery</small></button><button onclick="go('profile')">⭐<small>Profile</small></button></div>`}
function render(){let h='';switch(state.screen){case'setup':h=`<div class=setup><div class=logo1>🌈 Creative Quest</div><h2>Create your Explorer profile.</h2><input id=name class=input placeholder="Your name" value="${esc(state.name)}"><p><b>Choose an avatar</b></p><div class=avatars>${['🦊','🐼','🐸','🦄','🚀'].map(a=>`<button onclick="state.avatar='${a}';render()">${a}</button>`).join('')}</div>${btn('Start Creating →',"start()")}</div>`;break;
case'home':h=header()+card(`<h2>Hi, ${esc(state.name)}! ${state.avatar}</h2><p>Your imagination is your superpower.</p>${btn("Start Today's Quest →","go('quests')")}`)+card(`<b>🔥 Creative streak</b><p>Keep creating every day!</p>`)+card(`<b>🏅 Progress</b><p>${state.quests} quests completed • ${state.stars} stars</p><button class=link onclick="go('profile')">View Profile</button>`)+card(`<b>🖼️ My creations</b><br><button class=link onclick="go('gallery')">Open Gallery</button>`);break;
case'quests':h=`<div class=back><button class=link onclick="go('home')">←</button><span class=title>Creative Quests</span></div>`+qs.map(q=>card(`<h3>${q}</h3><p class=muted>Create it your way.</p><button class=link onclick="startQuest('${q}')">Choose →</button>`)).join('')+card(`<h3>🔥 Make It WILD!</h3><p>Tap to add a surprise twist.</p><button class=link onclick="state.wild=!state.wild;render()">${state.wild?'🔥 Wild Mode ON':'Wild Mode →'}</button>`);break;
case'activity':{let prompts={'Draw It ✏️':'Design a home for an alien.','Story Maker 📖':'Write a story about a robot who gets lost.','Music Maker 🎵':'Create a rhythm for a dancing planet.','Invent It 💡':'Invent something that solves a silly problem.','Act It Out 🎭':'Act out a character from another world.','Build It 🧱':'Build a bridge for a tiny dragon.'};let areas={'Draw It ✏️':'✏️ Draw here','Story Maker 📖':'📖 Write your story','Music Maker 🎵':'🎵 Tap a rhythm','Invent It 💡':'💡 Sketch your invention','Act It Out 🎭':'🎭 Practice your scene','Build It 🧱':'🧱 Plan your build'};h=`<div class=back><button class=link onclick="go('quests')">←</button><span class=title>${state.activity}</span></div>`+card(`<div class=wild>${state.wild?'🔥 WILD QUEST':'Today\'s Creative Quest'}</div><h2>${prompts[state.activity]}</h2>${state.wild?'<p><b>🔥 WILD: Add something surprising!</b></p>':''}<div class=canvas>${areas[state.activity]}</div><br>${btn('Finish Quest ✓',"go('complete')")}`);break}
case'complete':state.stars+=50;state.quests++;save();h=card(`<h1>🎉 Amazing!</h1><p>You made something new!</p><p>⭐ +50 Stars　🏅 Creativity Badge</p><p>Total: ${state.stars} stars • ${state.quests} quests</p>${btn('View Gallery',"go('gallery')")} <button class=link onclick="go('home')">Home</button>`);state.screen='done';break;
case'done':h=header()+card(`<h1>🎉 Quest Complete!</h1><p>You earned another 50 stars.</p>${btn('Start Another Quest',"go('quests')")}`);break;
case'profile':h=`<div class=back><button class=link onclick="go('home')">←</button><span class=title>My Profile</span></div>`+card(`<h2>${state.avatar} ${esc(state.name)}</h2><p>⭐ ${state.stars} stars</p><p>🚩 ${state.quests} quests completed</p>`)+card(`<b>🏅 Badge Collection</b><p><span class=badge>💡 Idea Maker</span><span class=badge>🔍 Explorer</span><span class=badge>🛠️ Builder</span><span class=badge>🌟 Experimenter</span></p>`)+card(`<b>🌈 Creative Journey</b><p>Try all six creative modes to discover new badges.</p>`);break;
case'gallery':h=`<div class=back><button class=link onclick="go('home')">←</button><span class=title>My Gallery</span></div>`+['🛸 Alien Home','🤖 Robot Story','💡 My Invention'].map(x=>card(`<h3>${x}</h3><p>Private creation • saved on this device</p>`)).join('');break;
case'parent':let first=!localStorage.parentPin;h=`<div class=setup><h1>🔒 Parent Area</h1><p>${first?'Create a 4-digit parent PIN.':'Enter the parent PIN.'}</p><input id=pin class=input inputmode=numeric maxlength=4 placeholder="4-digit PIN"><p class=error>${state.error}</p>${btn(first?'Create PIN':'Unlock','unlock()')}<button class=link onclick="go('home')">Cancel</button></div>`;break;
case'parentDash':h=`<div class=back><button class=link onclick="go('home')">←</button><span class=title>Parent Dashboard</span></div>`+card(`<h2>📊 Progress</h2><p>Quests completed: 6</p><p>Creative modes explored: 4</p><p>Badges earned: 3</p>`)+card(`<b>🛡️ Safety & Privacy</b><p>✓ No public messaging<br>✓ No stranger contact<br>✓ Creations private by default</p>`)+card(`<b>⏱️ Screen-time controls</b><p>Daily limit controls can be configured for production release.</p>`);break;}document.getElementById('root').innerHTML=h;document.getElementById('nav').innerHTML=nav()}
function start(){state.name=(document.getElementById('name').value||'Explorer').trim();save();go('home')}function startQuest(q){state.activity=q;go('activity')}function unlock(){let p=document.getElementById('pin').value;if(p.length!==4){state.error='Enter 4 digits';render();return}if(!localStorage.parentPin){localStorage.parentPin=btoa(p);go('parentDash')}else if(localStorage.parentPin===btoa(p)){state.error='';go('parentDash')}else{state.error='Incorrect PIN';render()}}render();
</script></body></html>
